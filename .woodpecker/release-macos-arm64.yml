---
# macOS arm64 release pipeline (native, Woodpecker local backend).
#
# Runs on the native darwin/arm64 exec agent (mac-mini-builder, 10.0.10.145) —
# no Linux container. macOS binaries cannot be produced in a container (Docker
# on macOS is a Linux VM), so this is the only path for tailwindcss-macos-arm64.
#
# Local backend specifics:
#   - `image:` names the SHELL used to run `commands` (bash), NOT a container.
#   - The agent host must have the toolchain in PATH (Elixir/OTP, Node, pnpm,
#     Rust + wasm32-wasip1-threads, Bun) and the `plugin-git` binary for cloning.
#     Provision with tailwind_builder_worker/scripts/provision-host.sh.
#
# Trigger: push to canary/* branches, or manual dispatch.
#
# Required secrets (same as canary-linux.yml): r2_access_key_id,
#   r2_secret_access_key, r2_host, r2_region.
#
# Output (shared canary channel, merges with the linux arches):
#   https://storage.defdo.de/tailwind_cli_daisyui_ci_canary/v4.3.3-rc1/tailwindcss-macos-arm64

labels:
  platform: darwin/arm64

when:
  - event: push
    branch:
      - canary/*
  - event: manual

# The darwin agent also runs each step with an EPHEMERAL HOME
# (.../woodpecker-local-<id>/home), so nothing installed into the developer's
# home is visible here: not asdf's installs (which is why .tool-versions does
# not reach this agent and node resolves to whatever the runner's PATH has),
# and not corepack's package cache. A pnpm prepared by hand on the machine is
# invisible; the run died with
#   Cannot find module '.../home/.cache/node/corepack/v1/pnpm/12.3.4/bin/pnpm.cjs'
# So the pipeline provisions pnpm itself — and not through corepack, which was
# three failed attempts:
#   1. a stable COREPACK_HOME: same error at the new path;
#   2. an explicit `corepack prepare`: downloads fine, shim still fails;
#   3. `npm install -g corepack@latest`: installs, shim still resolves .cjs.
# The download was never the problem. pnpm 12 ships ESM (`bin/pnpm.mjs`) and
# the corepack the agent's node can run resolves `bin/pnpm.cjs`:
#   Error: Cannot find module '.../v1/pnpm/12.3.4/bin/pnpm.cjs'
# corepack 0.36.0 refuses that node anyway (`EBADENGINE ... required: ^22.22.2
# || ^24.15.0 || >=26.0.0, current: v22.20.0`).
#
# @pnpm/exe is a self-contained pnpm binary with its own bundled node, so it
# needs neither corepack nor a newer node on the agent. Its version tracks the
# `packageManager` field of the Tailwind release this pipeline builds (4.3.3 ->
# 12.3.4); bump it alongside --version below.
#
# The version probe is deliberate: three runs were spent guessing what this
# agent resolves, because nothing in the log said.
#
# The darwin agent runs on a developer machine, so its Hex archive is whatever
# that machine last installed. It was compiled against an older Elixir and now
# crashes on Elixir 1.19.5 with `(UndefinedFunctionError) function Enum.__in__/2
# is undefined`, from Hex.HTTP.SSL.ssl_opts/1 — which breaks every Hex request,
# not just the org auth. `mix local.hex --force` reinstalls it for the running
# Elixir; the container pipelines get this for free from their image.

steps:
  - name: test
    image: bash
    environment:
      HEX_ORG_TOKEN:
        from_secret: hex_org_token
    commands:
      - node --version && which -a node pnpm || true
      - npm install -g @pnpm/exe@12.3.4
      - pnpm --version
      - mix local.hex --force
      - if [ -n "$HEX_ORG_TOKEN" ]; then mix hex.organization auth defdo --key "$HEX_ORG_TOKEN"; fi
      - mix deps.get
      - mix test

  - name: release-macos-arm64
    image: bash
    environment:
      HEX_ORG_TOKEN:
        from_secret: hex_org_token
      R2_ACCESS_KEY_ID:
        from_secret: r2_access_key_id
      R2_SECRET_ACCESS_KEY:
        from_secret: r2_secret_access_key
      R2_HOST:
        from_secret: r2_host
      R2_REGION:
        from_secret: r2_region
    commands:
      - node --version && which -a node pnpm || true
      - npm install -g @pnpm/exe@12.3.4
      - pnpm --version
      - mix local.hex --force
      - if [ -n "$HEX_ORG_TOKEN" ]; then mix hex.organization auth defdo --key "$HEX_ORG_TOKEN"; fi
      - mix deps.get
      - >-
        mix tailwind.release
        --version 4.3.3
        --channel v4.3.3-rc1
        --config-provider testing
        --bucket defdo
        --prefix tailwind_cli_daisyui_ci_canary
        --storage-base-url https://storage.defdo.de
        --plugin daisyui_v5
        --compose-targets linux-x64,linux-arm64,macos-arm64
        --smoke-test
        --verify-upload
        --verify-smoke-test
        --overwrite-policy overwrite
